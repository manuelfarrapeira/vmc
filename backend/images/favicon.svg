<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0d6efd" stroke="#0a58ca" stroke-width="2"/>

  <!-- Computer monitor -->
  <rect x="25" y="30" width="50" height="35" rx="2" fill="#ffffff"/>
  <rect x="27" y="32" width="46" height="28" fill="#0a58ca"/>

  <!-- Monitor stand -->
  <rect x="45" y="65" width="10" height="8" fill="#ffffff"/>
  <rect x="35" y="73" width="30" height="3" rx="1.5" fill="#ffffff"/>

  <!-- Code symbols on screen -->
  <text x="32" y="48" font-family="monospace" font-size="12" fill="#00ff88" font-weight="bold">&lt;/&gt;</text>

  <!-- Small circuit lines -->
  <line x1="32" y1="52" x2="42" y2="52" stroke="#00ff88" stroke-width="1.5"/>
  <line x1="58" y1="52" x2="68" y2="52" stroke="#00ff88" stroke-width="1.5"/>
  <circle cx="45" cy="52" r="2" fill="#00ff88"/>
  <circle cx="55" cy="52" r="2" fill="#00ff88"/>
</svg>
