<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background circle -->
  <circle cx="90" cy="90" r="88" fill="#0d6efd" stroke="#0a58ca" stroke-width="4"/>

  <!-- Computer monitor -->
  <rect x="40" y="50" width="100" height="70" rx="4" fill="#ffffff"/>
  <rect x="45" y="55" width="90" height="58" fill="#0a58ca"/>

  <!-- Monitor stand -->
  <rect x="80" y="120" width="20" height="15" fill="#ffffff"/>
  <rect x="60" y="135" width="60" height="6" rx="3" fill="#ffffff"/>

  <!-- Code symbols on screen -->
  <text x="60" y="88" font-family="monospace" font-size="24" fill="#00ff88" font-weight="bold">&lt;/&gt;</text>

  <!-- Small circuit lines -->
  <line x1="55" y1="98" x2="75" y2="98" stroke="#00ff88" stroke-width="3"/>
  <line x1="105" y1="98" x2="125" y2="98" stroke="#00ff88" stroke-width="3"/>
  <circle cx="82" cy="98" r="4" fill="#00ff88"/>
  <circle cx="98" cy="98" r="4" fill="#00ff88"/>
</svg>
